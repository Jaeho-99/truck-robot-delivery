[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truck-robot-delivery"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "gurobipy>=11.0",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pyproj>=3.6",
  "scipy>=1.10",
  "torch==2.5.1",
  "torch_geometric==2.8.0.post1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 79
target-version = "py310"
# Experimental variants keep their existing source style and behavior.
extend-exclude = [
  "src/v2_claude",
  "src/v2_codex",
  "scripts/summarize_results_v2_claude.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
