[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truck-robot-delivery"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "gurobipy>=11.0",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pyproj>=3.6",
  "scipy>=1.10",
  "torch==2.13.0",
  "torch_geometric==2.8.0.post1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
